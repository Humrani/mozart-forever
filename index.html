<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موسيقى موزارت للعالم | Mozart Forever</title>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background-color: #1e1e1e; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; max-width: 500px; width: 90%; border: 1px solid #333; }
        h1 { color: #d4af37; margin-bottom: 10px; font-size: 28px; }
        p { color: #aaaaaa; font-size: 14px; margin-bottom: 30px; }
        .player { background-color: #2a2a2a; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        audio { width: 100%; margin-top: 15px; outline: none; }
        .track-name { font-size: 18px; font-weight: bold; color: #ffffff; }
        .footer { margin-top: 30px; font-size: 12px; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Wolfgang Amadeus Mozart</h1>
        <p>موسيقى خالدة للعالم أجمع - إلى الأبد</p>
        <div class="player">
            <div class="track-name">Symphony No. 40 in G Minor (K. 550)</div>
            <audio controls>
                <source src="https://ia800905.us.archive.org/15/items/MozartSymphonyNo.40InGMinorK550/Mozart_Symphony_No.40_in_G_minor_K.550.mp3" type="audio/mpeg">
                متصفحك لا يدعم تشغيل الصوت.
            </audio>
        </div>
        <div class="footer">مفتوح المصدر - للجميع - للأبد | GitHub Pages</div>
    </div>
</body>
</html>
